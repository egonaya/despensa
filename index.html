<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Despensa</title>
  <meta name="description" content="Tu despensa, tu menú semanal ajustado a tus macros y tu lista de la compra.">
  <meta name="theme-color" content="#1f6f4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Despensa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="back" type="button" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="view-title">Plan</h1>
    <span id="view-subtitle" class="subtitle"></span>
  </header>

  <main>
    <!-- Plan semanal -->
    <section id="view-plan" class="view" data-title="Plan"></section>

    <!-- Despensa -->
    <section id="view-pantry" class="view" data-title="Despensa" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar en la despensa" autocomplete="off">
      </div>
      <div class="chips" role="tablist" aria-label="Filtro">
        <button class="chip active" data-filter="all">Todo</button>
        <button class="chip" data-filter="expiring">Caduca pronto</button>
        <button class="chip" data-filter="low">Se acaba</button>
        <button class="chip" data-filter="empty">Agotado</button>
        <button class="chip" data-filter="unlinked">Sin vincular</button>
      </div>
      <div id="pantry-alert"></div>
      <ul id="pantry-list" class="list"></ul>
      <div class="row wide-row">
        <button id="ticket-pantry" class="btn" type="button">Registrar ticket</button>
        <button id="manual-add-pantry" class="btn" type="button">Añadir sin código</button>
      </div>
    </section>

    <!-- Compra -->
    <section id="view-shopping" class="view" data-title="Lista de la compra" hidden>
      <form id="shopping-form" class="add-row">
        <input id="shopping-input" placeholder="Añadir algo a la lista" autocomplete="off" enterkeyhint="done">
        <button class="btn primary" type="submit">Añadir</button>
      </form>
      <button id="ticket-shopping" class="btn wide-top" type="button">¿Ya has comprado? Registra el ticket</button>
      <div id="shopping-list"></div>
      <button id="share-list" class="btn ghost wide" type="button">Compartir lista</button>
    </section>

    <!-- Más -->
    <section id="view-more" class="view" data-title="Más" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button class="tab active" data-view="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Plan</span><i class="dot" id="plan-dot" hidden></i>
    </button>
    <button class="tab" data-view="pantry">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16"/></svg>
      <span>Despensa</span><i class="dot" id="expiry-dot" hidden></i>
    </button>
    <button class="scan-fab" id="scan-btn" aria-label="Escanear producto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
    </button>
    <button class="tab" data-view="shopping">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span>Compra</span><i class="badge" id="shopping-count" hidden></i>
    </button>
    <button class="tab" data-view="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      <span>Más</span>
    </button>
  </nav>

  <!-- Escáner -->
  <dialog id="scanner-sheet" class="sheet scanner">
    <div class="video-wrap">
      <video id="scanner-video" playsinline muted></video>
      <div class="reticle" aria-hidden="true"></div>
      <p id="scanner-status" class="scanner-status">Apunta al código de barras</p>
    </div>
    <form id="manual-code-form" class="add-row">
      <input id="manual-code" inputmode="numeric" pattern="[0-9]{6,14}" placeholder="O escribe el código" autocomplete="off">
      <button class="btn" type="submit">Buscar</button>
    </form>
    <div class="row">
      <button id="manual-add" class="btn ghost" type="button">Producto sin código</button>
      <button class="btn ghost" type="button" data-close>Cerrar</button>
    </div>
  </dialog>

  <!-- Formulario de producto (nuevo o editar) -->
  <dialog id="product-sheet" class="sheet">
    <form id="product-form" method="dialog">
      <div class="sheet-head">
        <img id="pf-image" alt="" hidden>
        <div>
          <h2 id="pf-title">Nuevo producto</h2>
          <p id="pf-note" class="muted small"></p>
          <div id="pf-scores" class="scores"></div>
        </div>
      </div>
      <label>Alimento para el menú
        <select name="foodId" id="pf-food"></select>
      </label>
      <label>Nombre<input name="name" required autocomplete="off"></label>
      <div class="grid2">
        <label>Marca<input name="brand" autocomplete="off"></label>
        <label>Formato<input name="quantityLabel" placeholder="500 g, 1 L…" autocomplete="off"></label>
      </div>
      <div class="grid2">
        <label>Se cuenta en
          <select name="unit">
            <option value="ud">Unidades / envases</option>
            <option value="g">Gramos</option>
            <option value="ml">Mililitros</option>
          </select>
        </label>
        <label id="pf-ug-wrap">Cada unidad pesa (g)<input name="unitGrams" type="number" min="1" step="any" inputmode="decimal"></label>
      </div>
      <div class="grid2">
        <label>Categoría<input name="category" autocomplete="off"></label>
        <label><span id="pf-min-label">Avisar con menos de</span><input name="minStock" type="number" min="0" step="any" value="1" inputmode="decimal"></label>
      </div>
      <fieldset id="pf-initial">
        <legend>Lo que has comprado</legend>
        <div class="grid2">
          <label><span id="pf-qty-label">Unidades</span><input name="qty" type="number" min="0" step="any" value="1" inputmode="decimal"></label>
          <label>Caduca<input name="expiry" type="date"></label>
        </div>
      </fieldset>
      <label class="small muted">Código de barras<input name="barcode" inputmode="numeric" autocomplete="off"></label>
      <div class="row">
        <button class="btn ghost" type="button" data-close>Cancelar</button>
        <button class="btn primary" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Añadir cantidad a un producto existente -->
  <dialog id="stock-sheet" class="sheet">
    <form id="stock-form" method="dialog">
      <div class="sheet-head">
        <img id="sf-image" alt="" hidden>
        <div>
          <h2 id="sf-title"></h2>
          <p id="sf-note" class="muted small"></p>
        </div>
      </div>
      <div class="grid2">
        <label><span id="sf-qty-label">Unidades</span><input name="qty" type="number" min="0.01" step="any" value="1" inputmode="decimal" required></label>
        <label>Caduca<input name="expiry" type="date"></label>
      </div>
      <div class="row">
        <button class="btn ghost" type="button" data-close>Cancelar</button>
        <button class="btn primary" type="submit">Añadir a la despensa</button>
      </div>
    </form>
  </dialog>

  <!-- Hoja genérica: detalle de producto, receta, plato, formularios… -->
  <dialog id="sheet" class="sheet">
    <div id="sheet-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
